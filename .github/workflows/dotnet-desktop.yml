name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # 允许手动触发

jobs:

  build:

    runs-on: windows-latest

    env:
      Solution_Name: TabbyCat.sln
      Project_Directory: AvalonModules\TabbyCat\TabbyCat.Desktop
      Configuration: Release

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 确保完整获取历史记录，以支持 tag 创建

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # 还原依赖项
    - name: Restore dependencies
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration

    # 编译项目
    - name: Build the application
      run: msbuild $env:Solution_Name /p:Configuration=$env:Configuration

    # 将编译的 EXE 和相关文件压缩为 ZIP
    - name: Package EXE as ZIP
      run: |
        mkdir output
        Copy-Item -Path $env:Project_Directory\bin\${{ env.Configuration }}\* -Destination output -Recurse
        Compress-Archive -Path output\* -DestinationPath TabbyCat_${{ env.Configuration }}.zip

    # 读取提交日志并写入到 CHANGELOG.txt
    - name: Generate Release Notes
      run: |
        git log -1 --pretty=format:"%h %s" > CHANGELOG.txt

    # 创建 Tag（使用当前日期作为版本号）
    - name: Create Tag
      run: |
        $version = (Get-Date -Format "yyyy.MM.dd.HHmm")
        echo "TAG_NAME=v$version" >> $env:GITHUB_ENV
        git tag "v$version"
        git push origin "v$version"

    # 发布到 Release 并附上 CHANGELOG.txt 作为描述
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.TAG_NAME }}
        files: TabbyCat_${{ env.Configuration }}.zip
        body_path: CHANGELOG.txt   # 读取提交日志作为发布描述
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
