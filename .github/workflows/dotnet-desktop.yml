name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: TabbyCat.sln
      Project_Directory: TabbyCat.Desktop

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # 还原依赖项
    - name: Restore dependencies
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    # 编译项目
    - name: Build the application
      run: msbuild $env:Solution_Name /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    # 将编译的 EXE 和相关文件压缩为 ZIP
    - name: Package EXE as ZIP
      run: |
        mkdir output
        Copy-Item -Path $env:Project_Directory\bin\${{ matrix.configuration }}\* -Destination output -Recurse
        Compress-Archive -Path output\* -DestinationPath TabbyCat_${{ matrix.configuration }}.zip

    # 上传 ZIP 文件
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TabbyCat_Executable
        path: TabbyCat_${{ matrix.configuration }}.zip
