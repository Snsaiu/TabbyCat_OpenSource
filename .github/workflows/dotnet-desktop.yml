name: .NET Core Desktop Release

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    env:
      Solution_Name: AvalonModules/TabbyCat/TabbyCat.sln      # 你的解决方案路径
      Project_Path: AvalonModules/TabbyCat/TabbyCat.Desktop    # 你的主项目路径

    steps:
    - name: Checkout 代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # 获取完整提交历史，以便提取提交日志

    - name: 安装 .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: 恢复依赖
      run: dotnet restore $env:Solution_Name

    - name: 编译项目
      run: dotnet build $env:Project_Path --configuration Release --no-restore

    - name: 打包 ZIP 文件
      run: |
        Compress-Archive -Path $env:Project_Path\bin\Release\* -DestinationPath app-release.zip

    - name: 获取发布描述 (提交日志)
      id: get_release_notes
      run: |
        echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
        git log -1 --pretty=%B >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: 上传 ZIP 包和描述到后台
      run: |
        curl -X POST \
        -F "file=@app-release.zip" \
        -F "description=${{ env.RELEASE_NOTES }}" \
        -F "appName=TabbyCat" \
        -F "osType=0" \
        ${{ secrets.UPLOAD_APP_URL }}
