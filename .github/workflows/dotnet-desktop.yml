name: .NET Core Desktop Release

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    env:
      Solution_Name: TabbyCat.sln      # 你的解决方案路径
      Project_Path: AvalonModules/TabbyCat/TabbyCat.Desktop    # 你的主项目路径

    steps:
    - name: Checkout 代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # 获取完整提交历史，以便提取提交日志

    - name: 安装 .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: 恢复依赖
      run: dotnet restore $env:Solution_Name

    - name: 编译项目
      run: dotnet build $env:Project_Path --configuration Release --no-restore

    - name: 打包 ZIP 文件
      run: |
        Compress-Archive -Path $env:Project_Path\bin\Release\* -DestinationPath app-release.zip

    - name: 获取发布描述 (提交日志) 和版本号
      id: get_release_notes
      run: |
        echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
        git log -1 --pretty=%B >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

        # 使用当前时间作为版本号 (格式：yyyy.MM.dd.HHmmss)
        echo "VERSION=$(Get-Date -Format 'yyyy.MM.dd.HHmmss')" >> $GITHUB_ENV

    - name: 上传 ZIP 包和描述到后台
      run: |
        $releaseNotes = "${{ env.RELEASE_NOTES }}"
        if (-not $releaseNotes) {
          $releaseNotes = ""
        }
    
        $boundary = [System.Guid]::NewGuid().ToString()
    
        $body = @"
        --$boundary
        Content-Disposition: form-data; name="file"; filename="app-release.zip"
        Content-Type: application/zip
        
        $(Get-Content -Raw ".\app-release.zip")
        --$boundary
        Content-Disposition: form-data; name="description"
        
        $releaseNotes
        --$boundary
        Content-Disposition: form-data; name="appName"
        
        TabbyCat
        --$boundary
        Content-Disposition: form-data; name="osType"
        
        0
        --$boundary
        Content-Disposition: form-data; name="version"
        
        ${{ env.VERSION }}
        --$boundary--
        "@
        
            Invoke-WebRequest `
              -Uri "${{ secrets.UPLOAD_APP_URL }}" `
              -Method Post `
              -Headers @{ "Content-Type" = "multipart/form-data; boundary=$boundary" } `
              -Body $body

    


     
