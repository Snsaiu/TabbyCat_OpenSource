name: .NET Core Desktop macos Release

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    env:
      Solution_Name: TabbyCat.sln      # 你的解决方案路径
      Project_Path: AvalonModules/TabbyCat/TabbyCat.Desktop    # 你的主项目路径

    steps:
    - name: Checkout 代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # 获取完整提交历史，以便提取提交日志

    - name: 安装 .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Build and Create .app Bundle
      run: |
        PROJECT_NAME="TabbyCat.Desktop"
        OUTPUT_DIR="./bin/Release/net9.0/osx-arm64/publish"
        
        echo "Building for osx-arm64..."
        dotnet publish $Project_Path/$PROJECT_NAME.csproj -r osx-arm64 -c Release

        echo "Listing contents of output directory:"
        ls -R "$OUTPUT_DIR"

        echo "Creating the .app bundle..."
        APP_NAME="TabbyCat.app"
        CONTENT_PATH="$APP_NAME/Contents"
        MACOS_PATH="$CONTENT_PATH/MacOS"
        RESOURCES_PATH="$CONTENT_PATH/Resources"

        mkdir -p "$MACOS_PATH"
        mkdir -p "$RESOURCES_PATH"

        cp "$OUTPUT_DIR/$PROJECT_NAME" "$MACOS_PATH/"
        cp -R "$OUTPUT_DIR/"* "$MACOS_PATH/"
        cp -R "$OUTPUT_DIR/"*.dylib "$MACOS_PATH/" 2>/dev/null || true

        if [ -d "$OUTPUT_DIR/Resources" ]; then
            cp -R "$OUTPUT_DIR/Resources" "$RESOURCES_PATH/"
        fi

        if [ -d "$OUTPUT_DIR/Assets" ]; then
            cp -R "$OUTPUT_DIR/Assets" "$RESOURCES_PATH/"
        fi

        if [ -f "app.icns" ]; then
            echo "Copying app.icns to Resources..."
            cp "app.icns" "$RESOURCES_PATH/"
        fi

        cat <<EOF > "$CONTENT_PATH/Info.plist"
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
            <dict>
                <key>CFBundleIconFile</key>
                <string>app.icns</string>
                <key>CFBundleIdentifier</key>
                <string>com.youyan.tabbycat</string>
                <key>CFBundleName</key>
                <string>TabbyCat</string>
                <key>CFBundleVersion</key>
                <string>1.0.0</string>
                <key>LSMinimumSystemVersion</key>
                <string>10.12</string>
                <key>CFBundleExecutable</key>
                <string>TabbyCat.Desktop</string>
                <key>CFBundleInfoDictionaryVersion</key>
                <string>6.0</string>
                <key>CFBundlePackageType</key>
                <string>APPL</string>
                <key>CFBundleShortVersionString</key>
                <string>1.0</string>
                <key>NSHighResolutionCapable</key>
                <true/>
            </dict>
        </plist>
        EOF

        echo "Making application executable..."
        chmod +x "$MACOS_PATH/TabbyCat.Desktop"

    - name: Package .app into ZIP
      run: |
        cd proj
        zip -r app-release.zip *.app

    - name: Get release notes and version
      id: get_release_notes
      run: |
        echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
        git log -1 --pretty=%B >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

        echo "VERSION=$(date +'%Y.%m.%d.%H%M%S')" >> $GITHUB_ENV

    - name: Upload ZIP package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: AvaloniaApp-macOS-ZIP
        path: proj/app-release.zip

    - name: Upload ZIP package and metadata
      run: |
        releaseNotes=$(cat "$GITHUB_ENV" | grep RELEASE_NOTES | cut -d'=' -f2-)
        version=$(cat "$GITHUB_ENV" | grep VERSION | cut -d'=' -f2-)
        
        echo "🔎 RELEASE_NOTES: $releaseNotes"
        echo "🔎 VERSION: $version"
        
        curl -X POST "${{ secrets.UPLOAD_APP_URL }}" \
             -F "file=@proj/app-release.zip" \
             -F "description=$releaseNotes" \
             -F "appName=TabbyCat" \
             -F "osType=0" \
             -F "version=$version"
        
        echo "✅ 上传成功"
