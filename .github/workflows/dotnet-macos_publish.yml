name: publish-macos

on:
  push:
    branches: [ "Publish" ]

jobs:
  build:

    runs-on: macos-latest

    env:
      Solution_Name: TabbyCat.sln      # 你的解决方案路径
      Project_Path: AvalonModules/TabbyCat/TabbyCat.Desktop    # 你的主项目路径
  

    steps:
    - name: Checkout 代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # 获取完整提交历史，以便提取提交日志

    - name: 安装 .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Build and Create .app Bundle
      run: |
        PROJECT_NAME="TabbyCat.Desktop"
        OUTPUT_DIR="$Project_Path/bin/Release/net9.0/osx-arm64/publish"
        
        echo "Building for osx-arm64..."
        dotnet publish $Project_Path/$PROJECT_NAME.csproj -r osx-arm64 -c Release --self-contained -p:UseAppHost=true
        
        echo "Creating the .app bundle..."
        APP_NAME="TabbyCat.app"
        CONTENT_PATH="$Project_Path/$APP_NAME/Contents"
        MACOS_PATH="$CONTENT_PATH/MacOS"
        RESOURCES_PATH="$CONTENT_PATH/Resources"
        
        echo "content path :$CONTENT_PATH"

        mkdir -p "$MACOS_PATH"
        mkdir -p "$RESOURCES_PATH"

        cp "$OUTPUT_DIR/$PROJECT_NAME" "$MACOS_PATH/"
        cp -R "$OUTPUT_DIR/" "$MACOS_PATH/"
        cp -R "$OUTPUT_DIR/"*.dylib "$MACOS_PATH/" 2>/dev/null || true

        if [ -d "$OUTPUT_DIR/Resources" ]; then
            cp -R "$OUTPUT_DIR/Resources" "$RESOURCES_PATH/"
        fi

        if [ -d "$OUTPUT_DIR/Assets" ]; then
            cp -R "$OUTPUT_DIR/Assets" "$RESOURCES_PATH/"
        fi

        if [ -f "$Project_Path/app.icns" ]; then
            echo "Copying app.icns to Resources..."
            cp "$Project_Path/app.icns" "$RESOURCES_PATH/"
        fi

        cat <<EOF > "$CONTENT_PATH/Info.plist"
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
            <dict>
                <key>CFBundleIconFile</key>
                <string>app.icns</string>
                <key>CFBundleIdentifier</key>
                <string>com.youyan.tabbycat</string>
                <key>CFBundleName</key>
                <string>TabbyCat</string>
                <key>CFBundleVersion</key>
                <string>1.0.0</string>
                <key>LSMinimumSystemVersion</key>
                <string>10.12</string>
                <key>CFBundleExecutable</key>
                <string>TabbyCat.Desktop</string>
                <key>CFBundleInfoDictionaryVersion</key>
                <string>6.0</string>
                <key>CFBundlePackageType</key>
                <string>APPL</string>
                <key>CFBundleShortVersionString</key>
                <string>1.0</string>
                <key>NSHighResolutionCapable</key>
                <true/>
            </dict>
        </plist>
        EOF

                # Update your entitlements.plist creation:
        cat <<EOF > "$CONTENT_PATH/entitlements.plist"
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
            <key>com.apple.security.cs.allow-dyld-environment-variables</key>
            <true/>
            <key>com.apple.security.network.client</key>
            <true/>
            <key>com.apple.security.network.server</key>
            <true/>
            <key>com.apple.security.files.user-selected.read-write</key>
            <true/>
        </dict>
        </plist>
        EOF

        echo "Making application executable..."
        chmod +x "$MACOS_PATH/TabbyCat.Desktop"

    # - name: Code Sign Application
    #   run: |
    #     codesign --force --deep --sign "Developer ID Application: snsaiu@outlook.com (TEAM_ID)" --options=runtime TabbyCat.app
      

    - name: Package .app into ZIP
      run: |
        if ls "$Project_Path"/*.app 1> /dev/null 2>&1; then
          cd "$Project_Path"
          zip -r app-release.zip *.app
        else
          echo "❌ Error: No .app files found in $Project_Path"
          exit 1
        fi
        
    - name: Verify ZIP Creation
      run: |
        if [ -f "$Project_Path/app-release.zip" ]; then
          echo "✅ ZIP file exists."
        else
          echo "❌ ZIP file does not exist."
          exit 1
        fi


    - name: 获取发布描述 (提交日志) 和版本号
      id: get_release_notes
      run: |
        echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
        git log -1 --pretty=%B >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

         # 使用当前时间作为版本号 (格式：yyyy.MM.dd.HHmmss)
        echo "VERSION=$(date +'%Y.%m.%d.%H%M%S')" >> $GITHUB_ENV

    - name: 设置环境变量
      run: |
        echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
        git log -1 --pretty=%B >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

          # 使用当前时间作为版本号 (格式：yyyy.MM.dd.HHmmss)
        echo "VERSION=$(date +'%Y.%m.%d.%H%M%S')" >> $GITHUB_ENV

    - name: Upload ZIP package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: tabbycat-macOS-ZIP
        path: AvalonModules/TabbyCat/TabbyCat.Desktop/app-release.zip

    - name: Upload ZIP package and metadata
      run: |
        
        echo "🔎 RELEASE_NOTES: $RELEASE_NOTES"
        echo "🔎 VERSION: $VERSION"
        
        curl -X POST "${{ secrets.UPLOAD_APP_URL }}" \
             -F "file=@AvalonModules/TabbyCat/TabbyCat.Desktop/app-release.zip" \
             -F "description=$RELEASE_NOTES" \
             -F "appName=TabbyCat" \
             -F "osType=1" \
             -F "version=$VERSION"
        
        echo "✅ 上传成功"
