name: Test File Upload

on:
  workflow_dispatch:  # 手动触发，便于测试

jobs:
  upload:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 创建测试 ZIP 文件
      run: |
        New-Item -Path .\app-release -ItemType Directory
        Set-Content -Path .\app-release\test.txt -Value "测试内容"
        Compress-Archive -Path .\app-release\* -DestinationPath .\app-release.zip

    - name: 设置环境变量
      run: |
        echo "RELEASE_NOTES=测试版本发布说明" >> $env:GITHUB_ENV
        echo "VERSION=$(Get-Date -Format 'yyyyMMddHHmmss')" >> $env:GITHUB_ENV

    - name: 上传 ZIP 包和描述到后台
      run: |
        $releaseNotes = if ($env:RELEASE_NOTES) { $env:RELEASE_NOTES } else { "" }
        
        $formData = @{
            file = Get-Item -Path ".\app-release.zip"
            description = $releaseNotes
            appName = "TabbyCat"
            osType = 0
            version = $env:VERSION
        }

        Write-Host "🔎 RELEASE_NOTES: $releaseNotes"
        Write-Host "🔎 VERSION: $env:VERSION"

        try {
            $response = Invoke-WebRequest `
                -Uri "${{ secrets.UPLOAD_APP_URL }}" `
                -Method Post `
                -Form $formData `
                -ErrorAction Stop

            Write-Host "✅ 上传成功"
            Write-Host "响应内容: $($response.Content)"
        }
        catch {
            Write-Host "❌ 上传失败"
            Write-Host "错误信息: $_"
        }
